<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(assets/authentic-sans-90.woff2);font-weight:400}
@font-face{font-family:A;src:url(assets/authentic-sans-130.woff2);font-weight:600}
@font-face{font-family:A;src:url(assets/authentic-sans-60.woff2);font-weight:300}
:root{--cream:#f4f1ea;--ink:#424952;--gold:#a97e1f;--pad:8vmin}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--cream);font-family:A,sans-serif;color:var(--ink)}
.stage{position:absolute;inset:var(--pad);overflow:hidden}
.card{position:absolute;inset:0;overflow:hidden;background:#ddd}
.layer{position:absolute;inset:0;will-change:transform}
.layer img,.cover{width:100%;height:100%;object-fit:cover;display:block}
.layer img.cut{position:absolute;left:0;right:0;bottom:0;height:100%;object-fit:contain;object-position:50% 100%;width:100%}
.txt{position:absolute;left:5vmin;right:5vmin;bottom:5vmin;color:#fff}
.mono{font-family:"DejaVu Sans Mono",monospace;font-size:2.4vmin;letter-spacing:.25em;text-transform:uppercase}
.h{font-weight:600;font-size:6.4vmin;line-height:1.05;letter-spacing:-.02em}
.line{overflow:hidden;display:block}.line>span{display:inline-block;will-change:transform}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,24,30,.55),rgba(20,24,30,0) 55%)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vmin}
.rule{height:.35vmin;background:var(--gold);width:30vmin;transform-origin:left}
.grain{position:absolute;inset:-10%;pointer-events:none;opacity:.07;mix-blend-mode:multiply;background-size:300px}
.ch{display:inline-block;will-change:transform,opacity}
.frame{position:absolute;inset:0;border:.4vmin solid #a97e1f;pointer-events:none}
.num{font-family:"DejaVu Sans Mono",monospace;font-size:2.2vmin;letter-spacing:.2em}
</style></head><body><div id="root"></div><script>
const P=Math.PI*2, cl=x=>Math.max(0,Math.min(1,x)), ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const win=(t,a,b,c,d)=>ease(cl((t-a)/(b-a)))*(1-ease(cl((t-c)/(d-c)))); // in a→b, out c→d
const W=innerWidth,H=innerHeight,portrait=H>W*1.15,strip=H>W*3.5;
const R=document.getElementById('root');
const lines=(arr,cls='h')=>`<div class="${cls}">${arr.map(l=>`<span class="line"><span>${l}</span></span>`).join('')}</div>`;
const animLines=(el,t,a,b,c,d)=>[...el.querySelectorAll('.line>span')].forEach((s,i)=>{const o=i*.04;const k=win(t,a+o,b+o,c+o*.5,d+o*.5);s.style.transform=`translateY(${(1-k)*110}%)`});
const mark=(stroke='#424952',sw=4.8)=>`<svg viewBox="-3 -3 127.43 92.64" style="width:100%;overflow:visible"><polyline pathLength="1" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="square" stroke-miterlimit="10" points="2 84.64 2 56.06 27.52 38.21 27.52 3.23 96.77 37.67 96.77 3.59 49.38 3.59 49.38 84.64 71.25 84.64 71.25 55.88 119.43 55.88 119.43 84.64"/></svg>`;

const eo=x=>1-Math.pow(2,-10*cl(x)), ei=x=>Math.pow(2,10*(cl(x)-1)), eio=x=>{x=cl(x);return x<.5?ei(x*2)/2:1-ei((1-x)*2)/2};
const wn=(t,a,b,c,d)=>eo((t-a)/(b-a))*(1-ei((t-c)/(d-c)));// expo in/out window
const ctr=(a,st='')=>`<div class="center" style="${st}">${a}</div>`;
const ph=(f,pos='50% 50%',st='')=>`<img class="cover" src="assets/${f}.jpg" style="object-position:${pos};${st}">`;
const noise=(()=>{const c=document.createElement('canvas');c.width=c.height=300;const x=c.getContext('2d'),d=x.createImageData(300,300);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);return c.toDataURL()})();
const grain=()=>`<div class="grain" id="gr" style="background-image:url(${noise})"></div>`;
const chars=(s,cls='')=>`<span class="${cls}">${[...s].map(c=>`<span class="ch">${c===' '?'&nbsp;':c}</span>`).join('')}</span>`;
const animChars=(el,t,a,b,c,d,st=.025)=>[...el.querySelectorAll('.ch')].forEach((s,i)=>{const o=i*st;const k=wn(t,a+o,b+o,c+o*.4,d+o*.4);s.style.opacity=k;s.style.transform=`translateY(${(1-k)*40}%)`});
const G=t=>{const g=document.getElementById('gr');if(g)g.style.transform=`translate(${(Math.floor(t*50)%4)*2}%,${(Math.floor(t*50)%3)*2}%)`};
const corner=(p)=>`<div style="position:absolute;${p};width:4vmin;height:4vmin;border:.3vmin solid #a97e1f;${p.includes('top')?'border-bottom:0':'border-top:0'};${p.includes('left')?'border-right:0':'border-left:0'}"></div>`;
const corners=()=>corner('top:0;left:0')+corner('top:0;right:0')+corner('bottom:0;left:0')+corner('bottom:0;right:0');
const S={
logoDark:{dur:9,html:()=>`<div class="stage" style="background:#2f343b">${grain()}<div class="center" id="g"><div id="m" style="width:${strip?60:30}vmin">${mark('#a97e1f')}</div><div class="h" id="lt" style="color:#f4f1ea;font-size:${strip?11:9}vmin;letter-spacing:.32em;margin-left:.32em">${chars('LOWS')}</div><div class="mono" id="tg" style="color:#a97e1f;text-align:center">Design + Build</div></div></div>`,
 f:t=>{const p=document.querySelector('#m polyline');p.style.strokeDasharray='1 1';p.style.strokeDashoffset=1-wn(t,.03,.45,.86,.98);animChars(lt,t,.3,.55,.84,.95,.06);const k=wn(t,.5,.68,.82,.93);tg.style.opacity=k;tg.style.letterSpacing=(.25+.3*(1-k))+'em';g.style.transform=`scale(${1.03-.03*eio(t)})`;G(t)}},
blueprint:{dur:10,html:()=>`<div class="stage" style="background:#2b5672">${grain()}<div class="layer" style="background-image:linear-gradient(rgba(244,241,234,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(244,241,234,.12) 1px,transparent 1px);background-size:6vmin 6vmin" id="gd"></div><div class="center" id="c"><div style="position:relative;width:${strip?62:36}vmin"><div id="m">${mark('#f4f1ea',3)}</div><div id="dim" style="position:absolute;left:0;right:0;bottom:-5vmin;height:0;border-top:.2vmin solid #a97e1f;transform-origin:left"></div><div class="num" id="dn" style="position:absolute;left:0;right:0;bottom:-9vmin;text-align:center;color:#a97e1f">121.43</div></div><div class="mono" id="tg" style="color:#f4f1ea;margin-top:8vmin">Architectural design · Planning</div></div></div>`,
 f:t=>{const p=document.querySelector('#m polyline');p.style.strokeDasharray='1 1';p.style.strokeDashoffset=1-wn(t,.05,.5,.88,.98);dim.style.transform=`scaleX(${wn(t,.4,.6,.85,.95)})`;dn.style.opacity=wn(t,.55,.65,.85,.95);tg.style.opacity=wn(t,.6,.75,.86,.96);gd.style.transform=`translate(${-3*t}vmin,${-3*t}vmin)`;G(t)}},
roofing:{dur:9,html:()=>`<div class="stage"><div class="card" style="background:#424952"><div class="layer" id="bg"><img class="cover" src="assets/roofing.jpg" style="object-position:50% 60%;filter:grayscale(1) contrast(1.1)"></div><div class="layer" style="background:#a97e1f;mix-blend-mode:multiply;opacity:.85"></div><div class="layer" style="background:#2f343b;mix-blend-mode:lighten;opacity:.9"></div><div class="layer" id="rv" style="background:#f4f1ea"></div>${corners()}<div class="txt" id="tx"><div class="mono" id="mo" style="margin-bottom:2.5vmin;color:#a97e1f">03 — Roofing</div><div class="h" style="font-size:${strip?6:8}vmin">${chars(strip?'Pitched,':'Pitched, flat,')}<br>${chars(strip?'flat, done':'done properly')}</div></div></div></div>`,
 f:t=>{const r=wn(t,.0,.4,.88,.99);rv.style.transform=`translateY(${-r*100}%)`;const c=(1-Math.cos(t*P))/2;bg.style.transform=`scale(${1.08+.06*c}) translate(0,${1*Math.sin(t*P)}%)`;animChars(tx,t,.25,.45,.84,.95,.02);mo.style.opacity=wn(t,.2,.35,.86,.96)}},
loft:{dur:9,html:()=>`<div class="stage"><div id="msk" style="position:absolute;inset:0;overflow:hidden"><div class="layer" id="bg">${ph('loft','50% 30%')}</div><div class="shade"></div></div><div class="txt" id="tx" style="${portrait?'':'right:50%'}"><div class="mono" style="margin-bottom:2.5vmin;color:#a97e1f">01 — Loft conversions</div>${lines(strip?['Space','you','didn’t','know','you had']:['Space you','didn’t know','you had'])}</div></div>`,
 f:t=>{const k=wn(t,.0,.45,.88,.99);const ins=portrait?`${(1-k)*50}% 0 ${(1-k)*50}% 0`:`0 ${(1-k)*50}% 0 ${(1-k)*50}%`;msk.style.clipPath=`inset(${ins})`;bg.style.transform=`scale(${1.25-.12*eo(t*2)}) translate(${.6*Math.sin(t*P)}%,0)`;animLines(tx,t,.3,.5,.84,.95);tx.querySelector('.mono').style.opacity=wn(t,.25,.4,.86,.96)}},
wipe:{dur:10,html:()=>`<div class="stage"><div class="card"><div class="layer" id="a"><img class="cover" src="assets/threed.jpg" style="object-fit:${portrait?'contain':'cover'};transform:scale(${strip?2:1})"></div><div class="layer" id="b">${ph('renovations')}</div><div id="bar" style="position:absolute;top:-20%;bottom:-20%;width:.6vmin;background:#a97e1f;left:50%;transform:rotate(12deg);transform-origin:center"></div><div class="txt" id="tx" style="display:flex;justify-content:space-between;align-items:flex-end"><div class="h" id="l1" style="color:#424952;font-size:5vmin">${chars('Drawn')}</div><div class="h" id="l2" style="color:#fff;font-size:5vmin;text-align:right">${chars('Built')}</div></div></div></div>`,
 f:t=>{const w=eio((t-.2)/.45),back=ei((t-.85)/.15);const x=(w*(1-back))*100;b.style.clipPath=`polygon(${x+10}% 0,100% 0,100% 100%,${x-10}% 100%)`;bar.style.left=x+'%';bar.style.opacity=x>.5&&x<99.5?1:0;a.style.transform=`scale(${1.04+.05*t})`;b.style.transform=`scale(${1.1-.05*t})`;animChars(l1,t,.03,.2,.75,.88);animChars(l2,t,.55,.72,.86,.96)}},
words:{dur:10,html:()=>{const W=['We design.','We build.','We deliver.'];return `<div class="stage">${grain()}<div class="center" style="gap:3vmin"><div class="num" id="k" style="color:#a97e1f">Lows — est. London</div><div style="position:relative;height:${strip?30:10}vmin;width:100%">${W.map(w=>`<div class="h w" style="position:absolute;inset:0;text-align:center;font-size:${strip?6.5:7.5}vmin;line-height:1.1">${chars(w)}</div>`).join('')}</div><div class="rule" id="r" style="transform-origin:center"></div></div></div>`},
 f:t=>{[...document.querySelectorAll('.w')].forEach((e,i)=>{const a=.08+i*.27;animChars(e,t,a,a+.1,a+.2,a+.26,.015);const k=wn(t,a,a+.1,a+.2,a+.26);e.style.filter=`blur(${(1-k)*.8}vmin)`});k.style.opacity=wn(t,.02,.12,.9,.98);r.style.transform=`scaleX(${wn(t,.04,.2,.9,.98)})`;G(t)}},
areas:{dur:12,html:()=>{const A=['Clapham','Wandsworth','Balham','Dulwich','Streatham','Surrey'];return `<div class="stage" style="background:#424952;color:#f4f1ea">${grain()}<div class="center" style="gap:3vmin;align-items:${strip?'center':'flex-start'};padding:6vmin"><div class="mono" id="hd" style="color:#a97e1f">Working across</div><div style="position:relative;height:${strip?8:9}vmin;width:100%">${A.map(a=>`<div class="h ar line" style="position:absolute;inset:0;font-size:${strip?6.5:8.5}vmin;${strip?'text-align:center':''}"><span>${a}</span></div>`).join('')}</div><div class="mono" id="ft" style="margin-top:auto">South London &amp; beyond</div></div><div style="position:absolute;right:6vmin;top:6vmin;width:${strip?30:12}vmin" id="m">${mark('#a97e1f',4)}</div></div>`},
 f:t=>{const A=[...document.querySelectorAll('.ar>span')],n=A.length;A.forEach((s,i)=>{const a=.05+i*(.85/n),d=.85/n;const k=wn(t,a,a+.25*d,a+.8*d,a+d);s.style.transform=`translateY(${k<=0?110:(1-k)*110*(t<a+.5*d?1:-1)}%)`;s.style.opacity=k>0?1:0});hd.style.opacity=wn(t,.0,.1,.92,.99);ft.style.opacity=wn(t,.05,.15,.92,.99);const p=document.querySelector('#m polyline');p.style.strokeDasharray='1 1';p.style.strokeDashoffset=1-wn(t,.0,.3,.9,.99);G(t)}},
list:{dur:11,html:()=>{const it=['Loft conversions','Extensions','Renovations','Roofing','Architectural design','3D visualisation'];return `<div class="stage">${grain()}<div class="center" style="align-items:stretch;justify-content:center;padding:5vmin;gap:0"><div class="mono" id="hd" style="color:#a97e1f;margin-bottom:4vmin">What we do</div>${it.map((x,i)=>`<div class="row" style="position:relative;padding:${strip?2:1.8}vmin 0"><div class="dv" style="position:absolute;top:0;left:0;right:0;height:.15vmin;background:#424952;opacity:.3;transform-origin:left"></div><div class="line" style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-weight:600;font-size:${strip?4:4.6}vmin;letter-spacing:-.02em">${x}</span><span class="num" style="color:#a97e1f">0${i+1}</span></div></div>`).join('')}</div></div>`},
 f:t=>{[...document.querySelectorAll('.row')].forEach((r,i)=>{const o=i*.045;const k=wn(t,.08+o,.25+o,.8+o*.4,.9+o*.4);r.querySelector('.line').style.transform=`translateY(${(1-k)*100}%)`;r.querySelector('.line').style.opacity=k>0?1:0;r.querySelector('.dv').style.transform=`scaleX(${wn(t,.05+o,.3+o,.82+o*.4,.92+o*.4)})`});hd.style.opacity=wn(t,.02,.12,.9,.98);G(t)}},
overlay:{dur:11,html:()=>`<div class="stage" style="background:#f4f1ea"><div class="layer" id="a"><img class="cover" src="assets/threed.jpg" style="object-fit:${portrait?'contain':'cover'};transform:scale(${strip?2:1});mix-blend-mode:multiply"></div><div class="layer" id="ln" style="pointer-events:none"><div style="position:absolute;left:12%;top:0;bottom:0;width:.2vmin;background:#a97e1f;transform-origin:top" class="vl"></div><div style="position:absolute;right:12%;top:0;bottom:0;width:.2vmin;background:#a97e1f;transform-origin:bottom" class="vl"></div><div style="position:absolute;top:15%;left:0;right:0;height:.2vmin;background:#a97e1f;transform-origin:left" class="hl"></div><div style="position:absolute;bottom:15%;left:0;right:0;height:.2vmin;background:#a97e1f;transform-origin:right" class="hl"></div></div><div class="layer" id="b" style="opacity:0">${ph('extensions')}</div><div class="txt" id="tx" style="color:#424952"><div class="mono" id="m1">Plan</div></div><div class="txt" id="tx2" style="color:#fff;text-align:right"><div class="mono" id="m2">Built</div></div></div>`,
 f:t=>{const c=(1-Math.cos(t*P))/2;a.style.transform=`scale(${1.04+.08*c})`;[...document.querySelectorAll('.vl')].forEach(e=>e.style.transform=`scaleY(${wn(t,.05,.35,.5,.6)})`);[...document.querySelectorAll('.hl')].forEach(e=>e.style.transform=`scaleX(${wn(t,.1,.4,.5,.6)})`);const k=wn(t,.5,.68,.9,.99);b.style.opacity=k;b.style.clipPath=`inset(${(1-k)*15}% ${(1-k)*12}% ${(1-k)*15}% ${(1-k)*12}%)`;b.style.transform=`scale(${1.08-.05*k})`;m1.style.opacity=wn(t,.1,.25,.5,.6);m2.style.opacity=wn(t,.65,.78,.9,.98)}},
patType:{dur:9,html:()=>`<div class="stage" style="background:#f4f1ea">${grain()}<div class="layer" id="bt" style="display:flex;align-items:center;justify-content:center"><div class="h" style="font-size:${strip?30:portrait?38:44}vmin;color:transparent;-webkit-text-stroke:.25vmin #424952;opacity:.35;letter-spacing:-.04em;line-height:.85;text-align:center">${strip?'L<br>O<br>W<br>S':'LOWS'}</div></div><div class="layer" id="fg" style="${strip?'top:45%':portrait?'top:28%':'left:30%;top:8%'}"><img class="cut" src="assets/pat-cut.png" style="${portrait?'object-fit:cover;object-position:62% 100%':''}"></div><div class="txt" id="tx" style="color:#424952;display:flex;justify-content:space-between"><div class="mono">Pat</div><div class="mono">30 yrs on the tools</div></div></div>`,
 f:t=>{const c=(1-Math.cos(t*P))/2,s=Math.sin(t*P);bt.style.transform=`translate(${2.5*s}%,0) scale(${1+.04*c})`;fg.style.transform=`translate(${-.8*s}%,${(1-c)*1.2}%) scale(${1+.035*c})`;fg.style.transformOrigin='50% 100%';tx.style.opacity=wn(t,.1,.3,.8,.95);G(t)}},
duoDark:{dur:9,html:()=>`<div class="stage" style="background:#2f343b">${grain()}<div class="layer" id="mk" style="display:flex;align-items:flex-end;justify-content:flex-start;opacity:.16"><div style="width:${strip?220:110}%;margin-left:-20%">${mark('#a97e1f',2)}</div></div><div class="layer" id="fg" style="${strip?'top:55%':portrait?'top:38%':'left:28%;top:12%'}"><img class="cut" src="assets/sam-james-cut.png" style="${portrait?`object-fit:cover;object-position:${strip?28:50}% 100%`:''}"></div><div class="frame" id="fr" style="inset:3vmin"></div><div class="txt" id="tx" style="top:7vmin;bottom:auto;left:7vmin;${portrait?'':'right:55%'}"><div class="mono" style="color:#a97e1f;margin-bottom:2.5vmin">Sam &amp; James</div>${lines(strip?['Second','gener-','ation']:['Second','generation'])}</div></div>`,
 f:t=>{const c=(1-Math.cos(t*P))/2,s=Math.sin(t*P);mk.style.transform=`translate(${1.5*s}%,${-1*c}%) scale(${1+.05*c})`;fg.style.transform=`scale(${1+.04*c}) translate(${-.6*s}%,0)`;fg.style.transformOrigin='50% 100%';const k=wn(t,.0,.4,.9,.99);fr.style.clipPath=`inset(0 ${(1-k)*100}% 0 0)`;animLines(tx,t,.14,.32,.82,.95);tx.querySelector('.mono').style.opacity=wn(t,.08,.25,.85,.96);G(t)}},
quote:{dur:10,html:()=>`<div class="stage"><div class="layer" id="bg">${ph('hero-main','30% 50%')}</div><div class="layer" style="background:rgba(244,241,234,.9)"></div>${grain()}<div class="center" id="c" style="padding:6vmin"><div class="num" id="by" style="color:#a97e1f">“</div><div id="tx" style="text-align:center">${lines(strip?['Our','pride','is in','our','projects']:['Our pride is','in our projects'])}</div><div style="position:relative"><div class="mono" id="sg">Lows Design &amp; Build</div><div class="rule" id="r" style="position:absolute;left:0;right:0;bottom:-1vmin;width:auto;transform-origin:left"></div></div></div></div>`,
 f:t=>{bg.style.transform=`scale(${1.1+.06*t}) translate(${-1.5*t}%,0)`;bg.style.filter=`blur(${(1-wn(t,.0,.5,.9,1))*1.2}vmin)`;animLines(tx,t,.12,.32,.82,.95);r.style.transform=`scaleX(${wn(t,.35,.55,.85,.95)})`;sg.style.opacity=wn(t,.3,.45,.85,.96);by.style.opacity=wn(t,.05,.15,.88,.97);G(t)}},
grid:{dur:12,html:()=>{const it=['loft','extensions','roofing','renovations','threed','hero-main'];const col=!portrait;return `<div class="stage"><div style="position:absolute;inset:0;display:flex;flex-direction:${col?'row':'column'};gap:1.5vmin">${[0,1,2].map(i=>`<div style="flex:1;overflow:hidden;position:relative"><div class="strip" style="position:absolute;left:0;right:0;top:0;height:200%;display:flex;flex-direction:column;gap:1.5vmin">${[it[i],it[i+3],it[i],it[i+3]].map(f=>`<div style="flex:1;position:relative;overflow:hidden">${ph(f)}</div>`).join('')}</div></div>`).join('')}</div><div class="center"><div class="mono" id="tx" style="background:#f4f1ea;color:#424952;padding:2vmin 3.5vmin">Design &amp; Build</div></div></div>`},
 f:t=>{[...document.querySelectorAll('.strip')].forEach((e,i)=>{const d=i%2?-1:1;e.style.transform=`translateY(${(d>0?-50*t:-50+50*t)}%)`});tx.style.opacity=wn(t,.08,.2,.88,.97)}},

 f:t=>{const p=document.querySelector('#m polyline');p.style.strokeDasharray='1 1';p.style.strokeDashoffset=1-wn(t,.02,.4,.86,.98);animLines(tx,t,.15,.35,.82,.95);u.style.opacity=wn(t,.35,.5,.85,.96);ar.style.transform=`scaleX(${wn(t,.45,.6,.85,.95)}) translateX(${Math.sin(t*P*2)*.6}vmin)`;c.style.transform=`scale(${1+.03*t})`;G(t)}},
};
window.setup=n=>{R.innerHTML=S[n].html();window.F=S[n].f;return Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>document.fonts.ready).then(()=>S[n].dur)};
