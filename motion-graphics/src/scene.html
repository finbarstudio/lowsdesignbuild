<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(assets/authentic-sans-90.woff2);font-weight:400}
@font-face{font-family:A;src:url(assets/authentic-sans-130.woff2);font-weight:600}
@font-face{font-family:A;src:url(assets/authentic-sans-60.woff2);font-weight:300}
:root{--cream:#f4f1ea;--ink:#424952;--gold:#a97e1f;--pad:8rem}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--cream);font-family:A,sans-serif;color:var(--ink)}
.stage{position:absolute;inset:var(--pad);overflow:hidden}
.card{position:absolute;inset:0;overflow:hidden;background:#ddd}
.layer{position:absolute;inset:0;will-change:transform}
.layer img,.cover{width:100%;height:100%;object-fit:cover;display:block}
.layer img.cut{position:absolute;left:0;right:0;bottom:0;height:100%;object-fit:contain;object-position:50% 100%;width:100%}
.txt{position:absolute;left:5rem;right:5rem;bottom:5rem;color:#fff}
.mono{font-family:"DejaVu Sans Mono",monospace;font-size:3.4rem;letter-spacing:.25em;text-transform:uppercase}
.h{font-weight:600;font-size:9rem;line-height:1.05;letter-spacing:-.02em}
.line{overflow:hidden;display:block}.line>span{display:inline-block;will-change:transform}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,24,30,.55),rgba(20,24,30,0) 55%)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5rem}
.rule{height:.35rem;background:var(--gold);width:30rem;transform-origin:left}
.strip .mono{font-size:5rem;letter-spacing:.15em}.strip .h{font-size:13rem}.strip .num{font-size:4.5rem}
</style></head><body><div id="root"></div><script>
const P=Math.PI*2, cl=x=>Math.max(0,Math.min(1,x)), ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const win=(t,a,b,c,d)=>ease(cl((t-a)/(b-a)))*(1-ease(cl((t-c)/(d-c)))); // in a→b, out c→d
const W=innerWidth,H=innerHeight,portrait=H>W*1.15,strip=H>W*3.5;document.documentElement.style.fontSize=(portrait?W/100:H/80)+'px';if(strip)document.documentElement.classList.add('strip');
const R=document.getElementById('root');
const lines=(arr,cls='h')=>`<div class="${cls}">${arr.map(l=>`<span class="line"><span>${l}</span></span>`).join('')}</div>`;
const animLines=(el,t,a,b,c,d)=>[...el.querySelectorAll('.line>span')].forEach((s,i)=>{const o=i*.04;const k=win(t,a+o,b+o,c+o*.5,d+o*.5);s.style.transform=`translateY(${(1-k)*110}%)`});
const mark=(stroke='#424952',sw=5.2)=>`<svg viewBox="-3 -3 127.43 92.64" style="width:100%;overflow:visible"><polyline pathLength="1" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="square" stroke-miterlimit="10" points="2 84.64 2 56.06 27.52 38.21 27.52 3.23 96.77 37.67 96.77 3.59 49.38 3.59 49.38 84.64 71.25 84.64 71.25 55.88 119.43 55.88 119.43 84.64"/></svg>`;
const S={
logo:{dur:8,html:()=>`<div class="center" id="g"><div id="m" style="width:${strip?70:36}rem">${mark()}</div><img id="lt" src="assets/logotype.svg" style="width:${strip?80:44}rem"><div class="rule" id="r"></div><div class="mono" id="tg" style="text-align:center">Design &amp; Build · South London</div></div>`,
 f:t=>{const p=document.querySelector('#m polyline');const d=win(t,.02,.4,.86,.98);p.style.strokeDasharray='1 1';p.style.strokeDashoffset=1-d;
  const l=win(t,.25,.45,.84,.95);lt.style.opacity=l;lt.style.transform=`translateY(${(1-l)*3}rem)`;
  r.style.transform=`scaleX(${win(t,.35,.55,.82,.93)})`;const k=win(t,.42,.6,.8,.92);tg.style.opacity=k;tg.style.letterSpacing=(.25+.15*(1-k))+'em';
  g.style.transform=`scale(${1+.05*t})`}},
hero:{dur:8,html:()=>`<div class="stage"><div class="card"><div class="layer" id="bg"><img src="assets/hero-main.jpg" style="object-position:30% 50%"></div><div class="shade"></div><div class="txt" id="tx"><div class="mono" style="margin-bottom:2.5rem">Lows Design &amp; Build</div>${lines(strip?['Family','run','builders','in','London']:['Family run','construction','in London'])}</div></div></div>`,
 f:t=>{const c=(1-Math.cos(t*P))/2;bg.style.transform=`scale(${1.08+.05*c}) translate(${-1.5*Math.sin(t*P)}%,${-.8*c}%)`;animLines(tx,t,.12,.3,.82,.95);tx.querySelector('.mono').style.opacity=win(t,.08,.25,.85,.96)}},
chairs:{dur:8,html:()=>`<div class="stage"><div class="card"><div class="layer" id="bg"><img src="assets/extensions.jpg"></div><div class="layer" id="fg"><img src="assets/extensions-cut.png"></div><div class="shade" style="opacity:.6"></div><div class="txt" id="tx"><div class="mono">Renovations · Interiors</div></div></div></div>`,
 f:t=>{const s=Math.sin(t*P),c=(1-Math.cos(t*P))/2;bg.style.transform=`scale(${1.06+.015*c}) translate(${.8*s}%,0)`;fg.style.transform=`scale(${1.06+.06*c}) translate(${-1.2*s}%,${-.6*c}%)`;fg.style.transformOrigin='50% 75%';tx.style.opacity=win(t,.1,.3,.8,.95)}},
team:{dur:8,html:()=>`<div class="stage"><div class="card" style="background:#e2dcd0"><div class="layer" id="bg" style="background:radial-gradient(circle at 60% 40%,#f4f1ea,#d9d1c1)"></div><div class="layer" id="ty" style="display:flex;align-items:${portrait?'flex-start':'center'};padding:6rem;${portrait?'padding-top:9rem':''}"><div style="color:var(--ink)">${lines(strip?['Family','run','since','day','one']:['Family run.','Hands on.'])}</div></div><div class="layer" id="fg" style="${strip?'top:55%':portrait?'top:40%':'left:30%;top:12%'}"><img class="cut" src="assets/sam-james-cut.png" style="${portrait?`object-fit:cover;object-position:${strip?28:50}% 100%`:""}"></div></div></div>`,
 f:t=>{const c=(1-Math.cos(t*P))/2,s=Math.sin(t*P);bg.style.transform=`scale(${1.12+.03*c}) translate(${1*s}%,0)`;fg.style.transform=`scale(${1+.045*c}) translate(${-.8*s}%,0)`;fg.style.transformOrigin='50% 100%';ty.style.transform=`translateX(${.6*s}%)`;animLines(ty,t,.12,.3,.82,.95)}},
pat:{dur:8,html:()=>`<div class="stage" style="background:#2f343b"><div class="layer" id="mk" style="display:flex;align-items:center;justify-content:center;opacity:.22"><div style="width:${strip?160:85}%">${mark('#a97e1f')}</div></div><div class="layer" id="fg" style="${strip?'top:50%':portrait?'top:30%':'left:35%;top:10%'}"><img class="cut" src="assets/pat-cut.png" style="${portrait?"object-fit:cover;object-position:62% 100%":""}"></div><div class="txt" id="tx" style="${portrait?'top:6rem;bottom:auto':'top:6rem;bottom:auto;right:55%'}"><div class="mono" style="color:#a97e1f;margin-bottom:2.5rem">Since day one</div>${lines(strip?['Our','quality','guarantee']:['Our quality','guarantee'])}</div></div>`,
 f:t=>{const c=(1-Math.cos(t*P))/2,s=Math.sin(t*P);mk.style.transform=`scale(${1+.06*c}) translate(${1.2*s}%,${-1*c}%)`;fg.style.transform=`translateY(${(1-c)*1.5}%) scale(${1+.03*c})`;fg.style.transformOrigin='50% 100%';animLines(tx,t,.14,.32,.82,.95);tx.querySelector('.mono').style.opacity=win(t,.08,.25,.85,.96)}},
services:{dur:15,html:()=>{const it=[['loft','Loft Conversions'],['extensions','Extensions'],['renovations','Renovations'],['roofing','Roofing'],['architectural','Architectural Design']];return `<div class="stage"><div class="card">${it.map((x,i)=>`<div class="layer sv" style="opacity:0"><img class="cover" src="assets/${x[0]}.jpg"><div class="shade"></div><div class="txt"><div class="mono" style="margin-bottom:2rem">0${i+1} / 05</div>${lines(strip?x[1].split(' '):[x[1]])}</div></div>`).join('')}</div></div>`},
 f:t=>{const L=[...document.querySelectorAll('.sv')],n=L.length;L.forEach((el,i)=>{let u=((t*n-i)%n+n)%n; // 0..n, active when u in [0,1)
  const vis=u<1?1:(u>n-.12?ease((u-(n-.12))/.12):0);el.style.opacity=u<1?1:vis;el.style.zIndex=u<1?1:(u>n-.12?2:0);
  const lp=u>n-.12?0:u;el.querySelector('img').style.transform=`scale(${1.04+.05*lp})`;animLines(el,lp,.08,.22,.86,.98);el.querySelector('.mono').style.opacity=win(lp,.05,.2,.88,.98)})}},
plans:{dur:8,html:()=>`<div class="stage" style="background:#fff"><div class="layer" id="bg"><img class="cover" src="assets/threed.jpg" style="object-fit:${portrait?'contain':'cover'};transform:scale(${strip?2.2:1})"></div><div class="txt" id="tx" style="color:var(--ink);bottom:auto;top:5rem;display:flex;justify-content:space-between;align-items:flex-start"><div style="width:${strip?14:9}rem" id="m">${mark('#a97e1f')}</div><div class="mono" id="mo">Drawings · Planning</div></div></div>`,
 f:t=>{const c=(1-Math.cos(t*P))/2;bg.style.transform=`scale(${1.05+.07*c}) translate(${-1.5*Math.sin(t*P)}%,${-2*c}%)`;const p=document.querySelector('#m polyline');p.style.strokeDasharray='1 1';p.style.strokeDashoffset=1-win(t,.05,.4,.85,.98);mo.style.opacity=win(t,.25,.4,.85,.95)}},
};
window.setup=n=>{R.innerHTML=S[n].html();window.F=S[n].f;return Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>document.fonts.ready).then(()=>S[n].dur)};
</script></body></html>
